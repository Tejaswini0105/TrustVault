
{% extends "base.html" %}

{% block title %}Register | TrustVault{% endblock %}

{% block content %}
<div class="form-card card shadow-sm mx-auto" style="max-width: 520px;">
  <div class="card-body p-4">
    <h2 class="mb-2">Create your account</h2>
    <p class="text-muted">Register to use TrustVault securely.</p>

    <form method="post" action="{{ url_for('register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label class="form-label mt-2">Full name</label>
      <input
        class="form-control"
        type="text"
        name="full_name"
        maxlength="120"
        autocomplete="name"
        required
      >

      <label class="form-label mt-3">Email address</label>
      <input
        class="form-control"
        type="email"
        name="email"
        autocomplete="email"
        required
      >

      <label class="form-label mt-3">Password</label>
      <input
        class="form-control"
        type="password"
        name="password"
        minlength="10"
        autocomplete="new-password"
        required
      >

      <label class="form-label mt-3">Account role</label>
      <select class="form-select" name="role" required>
        <option value="viewer" selected>Viewer — view shared documents</option>
        <option value="owner">Owner — upload and manage own documents</option>
      </select>

      <button class="btn btn-primary w-100 mt-4" type="submit">
        Create account
      </button>
    </form>

    <p class="text-center mt-3 mb-0">
      Already registered?
      <a href="{{ url_for('login') }}">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
